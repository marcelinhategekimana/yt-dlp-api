# Render.com deployment configuration (CPU - free tier compatible)
# Deploy: Connect GitHub repo → Auto-deploy

services:
  - type: web
    name: reclip-api
    runtime: docker
    plan: free  # Free tier with CPU-only Whisper
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8080
      - key: GPU_ENABLED
        value: "false"
      - key: WHISPER_MODEL
        value: "tiny"  # Tiny model for free tier memory limits
